<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Do Androids Ever Argue About Electric Sheep?</title>
  <style>
    :root {
      --bg:           #111b21;
      --header-bg:    #202c33;
      --chat-bg:      #0b141a;
      --left-bubble:  #1f2c34;
      --right-bubble: #005c4b;
      --border:       #2a3942;
      --accent:       #00a884;
      --accent-dim:   #00543f;
      --text:         #e9edef;
      --text-muted:   #8696a0;
      --left-color:   #53bdeb;
      --right-color:  #06cf9c;
      --font:         'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }
    body { background: var(--bg); color: var(--text); font-family: var(--font); display: flex; flex-direction: column; overflow: hidden; }

    /* â”€â”€ Header â”€â”€ */
    header {
      background: var(--header-bg);
      padding: 0.65rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.85rem;
      flex-shrink: 0;
      z-index: 20;
      border-bottom: 1px solid var(--border);
    }
    #back-btn {
      display: none;
      background: transparent;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 1.4rem;
      line-height: 1;
      padding: 0.25rem 0.4rem;
      border-radius: 50%;
      transition: background 0.15s;
    }
    #back-btn:hover { background: rgba(255,255,255,0.08); }
    #about-btn {
      margin-left: auto;
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 1rem;
      line-height: 1;
      padding: 0.25rem 0.5rem;
      border-radius: 50%;
      transition: background 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    #about-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(0,168,132,0); color: var(--accent); }
      50%       { box-shadow: 0 0 0 6px rgba(0,168,132,0.25); color: #00d4a8; }
    }
    #about-btn { animation: pulse-glow 2.4s ease-in-out infinite; color: var(--accent); font-size: 1.25rem; border-radius: 50%; }
    .site-title { font-size: 0.9rem; font-weight: 600; color: var(--text); letter-spacing: 0.01em; }
    #header-sub { font-size: 0.75rem; color: var(--text); opacity: 0.75; margin-top: 0.05rem; }

    /* â”€â”€ Main â”€â”€ */
    main { width: 100%; flex: 1; overflow: hidden; display: flex; flex-direction: column; }

    /* â”€â”€ List view â”€â”€ */
    #list-view { padding: 1.25rem 1.5rem; flex: 1; overflow-y: auto; }
    #cards { max-width: 100%; }
    .list-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 0.4rem 0.5rem 0.7rem;
    }
    .conv-card {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.9rem;
      transition: background 0.12s;
    }
    .conv-card:first-of-type { border-top: 1px solid var(--border); border-radius: 10px 10px 0 0; }
    .conv-card:last-of-type  { border-bottom: none; border-radius: 0 0 10px 10px; }
    .conv-card:only-of-type  { border-radius: 10px; }
    .conv-card:hover { background: #2a3942; }
    .card-av {
      display: flex; align-items: center;
      flex-shrink: 0; position: relative;
      width: 52px; height: 46px;
    }
    .card-av .av {
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.78rem; font-weight: 700;
      border: 2px solid var(--header-bg);
      position: absolute;
    }
    .card-av .av:first-child { left: 0; z-index: 2; }
    .card-av .av:last-child  { left: 18px; z-index: 1; }
    .card-av .av.ls { background: var(--accent-dim); color: var(--accent); }
    .card-av .av.rs { background: #0a3d2e; color: var(--right-color); }
    .card-body  { flex: 1; min-width: 0; }
    .card-topic {
      font-size: 0.93rem; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 0.25rem;
    }
    .card-meta  { font-size: 0.76rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
    .card-date  { font-size: 0.7rem; color: var(--text-muted); flex-shrink: 0; margin-left: auto; padding-left: 0.5rem; }
    .tag {
      padding: 0.1rem 0.5rem; border-radius: 99px;
      font-size: 0.68rem; font-weight: 600;
      cursor: pointer; transition: opacity 0.15s;
    }
    .tag:hover { opacity: 0.75; }
    .tag.ls { background: #0d2d3d; color: var(--left-color); }
    .tag.rs { background: #0a2e22; color: var(--right-color); }

    /* â”€â”€ Detail / Chat view â”€â”€ */
    #detail-view { display: none; flex: 1; flex-direction: column; overflow: hidden; max-width: 760px; width: 100%; margin: 0 auto; }
    #chat-header { display: none; }
    .ch-avatars { display: flex; }
    .ch-av {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem; font-weight: 700;
      border: 2px solid var(--header-bg);
    }
    .ch-av:nth-child(2) { margin-left: -8px; }
    .ch-av.ls { background: var(--accent-dim); color: var(--accent); }
    .ch-av.rs { background: #0a3d2e; color: var(--right-color); }
    .ch-topic {
      font-size: 0.88rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
    }
    .ch-info { min-width: 0; flex: 1; }
    .ch-participants { font-size: 0.7rem; color: var(--text-muted); }

    /* â”€â”€ Chat messages â”€â”€ */
    #chat-messages {
      background: var(--chat-bg);
      padding: 1rem 0.85rem 2rem;
      flex: 1;
      overflow-y: auto;
    }
    .message { display: flex; gap: 0.45rem; margin-bottom: 0.4rem; }
    .message.right { flex-direction: row-reverse; }
    .msg-av {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 700;
      flex-shrink: 0; align-self: flex-end;
      cursor: pointer; transition: opacity 0.15s;
    }
    .msg-av:hover { opacity: 0.75; }
    .msg-av.ls { background: var(--accent-dim); color: var(--accent); }
    .msg-av.rs { background: #0a3d2e; color: var(--right-color); }
    .msg-body { max-width: 74%; display: flex; flex-direction: column; }
    .message.right .msg-body { align-items: flex-end; }
    .msg-name {
      font-size: 0.7rem; font-weight: 600;
      margin-bottom: 0.18rem; padding: 0 0.3rem;
      cursor: pointer; text-transform: capitalize;
    }
    .msg-name:hover { text-decoration: underline; }
    .msg-name.ls { color: var(--left-color); }
    .msg-name.rs { color: var(--right-color); }
    .bubble {
      padding: 0.5rem 0.8rem 0.35rem;
      font-size: 0.875rem; line-height: 1.62;
      white-space: pre-wrap; word-break: break-word;
    }
    .message.left  .bubble { background: var(--left-bubble);  border-radius: 0 12px 12px 12px; }
    .message.right .bubble { background: var(--right-bubble); border-radius: 12px 0 12px 12px; }
    .msg-time { font-size: 0.62rem; color: var(--text-muted); margin-top: 0.18rem; padding: 0 0.3rem; }

    /* â”€â”€ Character Modal â”€â”€ */
    #modal {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.72);
      z-index: 100;
      align-items: center; justify-content: center;
      padding: 1.5rem;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to   { opacity: 1; transform: scale(1); }
    }
    .modal-card {
      background: var(--header-bg);
      border-radius: 16px; padding: 1.75rem;
      max-width: 440px; width: 100%;
      max-height: 82vh; overflow-y: auto;
      border: 1px solid var(--border);
      position: relative;
      animation: fadeIn 0.18s ease forwards;
    }
    .modal-close {
      position: absolute; top: 1rem; right: 1rem;
      background: transparent; border: none;
      color: var(--text-muted); font-size: 1.1rem;
      cursor: pointer; padding: 0.2rem 0.4rem;
      border-radius: 6px; line-height: 1;
    }
    .modal-close:hover { color: var(--text); background: rgba(255,255,255,0.08); }
    .modal-av {
      width: 68px; height: 68px; border-radius: 50%;
      margin: 0.25rem auto 0.85rem;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.65rem; font-weight: 700;
    }
    .modal-av.ls { background: var(--accent-dim); color: var(--accent); }
    .modal-av.rs { background: #0a3d2e; color: var(--right-color); }
    .modal-name { text-align: center; font-size: 1.15rem; font-weight: 700; margin-bottom: 0.2rem; }
    .modal-id   { text-align: center; font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 1.25rem; }
    .modal-label{ font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 0.4rem; }
    .modal-bio  { font-size: 0.855rem; line-height: 1.68; background: rgba(0,0,0,0.25); border-radius: 8px; padding: 0.8rem 0.95rem; }

    .state-msg  { text-align: center; padding: 3rem 1rem; color: var(--text-muted); font-size: 0.88rem; }

    /* ── Footer ── */
    footer {
      flex-shrink: 0;
      background: var(--header-bg);
      border-top: 1px solid var(--border);
      padding: 0.55rem 1.25rem 0.6rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.74rem;
      color: var(--text-muted);
    }
    .footer-tagline {
      font-size: 0.7rem;
      color: var(--text-muted);
      opacity: 0.7;
      letter-spacing: 0.01em;
    }
    .footer-tagline em { font-style: normal; color: var(--accent); opacity: 1; }
    .footer-links { display: flex; align-items: center; gap: 1rem; }
    footer a {
      color: var(--text-muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      transition: color 0.15s;
    }
    footer a:hover { color: var(--accent); }
    footer .gh-icon { width: 15px; height: 15px; fill: currentColor; }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      header { padding: 0.55rem 0.85rem; gap: 0.6rem; }
      .site-title { font-size: 0.72rem; }
      #list-view { padding: 0.65rem; }
      .conv-card { padding: 0.75rem 0.8rem; gap: 0.7rem; }
      .card-av { width: 46px; height: 40px; }
      .card-av .av { width: 28px; height: 28px; font-size: 0.68rem; }
      .card-av .av:last-child { left: 15px; }
      .card-topic { font-size: 0.88rem; }
      .card-date { display: none; }
      #chat-messages { padding: 0.75rem 0.5rem 2rem; }
      .msg-body { max-width: 84%; }
      .bubble { font-size: 0.84rem; padding: 0.45rem 0.7rem 0.3rem; }
      /* bottom sheet handled below */
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to   { transform: translateY(0); }
    }
    @keyframes slideDown {
      from { transform: translateY(0); opacity: 1; }
      to   { transform: translateY(100%); opacity: 0; }
    }
    @keyframes fadeOut {
      from { opacity: 1; transform: scale(1); }
      to   { opacity: 0; transform: scale(0.96); }
    }
    @media (max-width: 600px) {
      .modal-card.closing { animation: slideDown 0.26s cubic-bezier(0.32,0.72,0,1) forwards; }
    }
    @media (min-width: 601px) {
      .modal-card.closing { animation: fadeOut 0.18s ease forwards; }
    }

    /* ── Mobile ── */
    @media (max-width: 600px) {
      header { padding: 0.55rem 0.85rem; gap: 0.6rem; }
      .site-title { font-size: 0.72rem; }
      #list-view { padding: 0.65rem; }
      .conv-card { padding: 0.75rem 0.8rem; gap: 0.7rem; }
      .card-av { width: 46px; height: 40px; }
      .card-av .av { width: 28px; height: 28px; font-size: 0.68rem; }
      .card-av .av:last-child { left: 15px; }
      .card-topic { font-size: 0.88rem; }
      .card-date { display: none; }
      #chat-messages { padding: 0.75rem 0.5rem 2rem; }
      .msg-body { max-width: 84%; }
      .bubble { font-size: 0.84rem; padding: 0.45rem 0.7rem 0.3rem; }
      /* Bottom sheet */
      #modal { align-items: flex-end; padding: 0; }
      .modal-card {
        width: 100%; max-width: 100%;
        border-radius: 20px 20px 0 0;
        padding: 1rem 1.25rem 2rem;
        max-height: 85vh;
        animation: slideUp 0.28s cubic-bezier(0.32,0.72,0,1);
      }
      .modal-card::before {
        content: '';
        display: block;
        width: 36px; height: 4px;
        background: var(--text-muted);
        border-radius: 2px;
        margin: 0 auto 1.1rem;
        opacity: 0.35;
      }
      .modal-av { width: 56px; height: 56px; font-size: 1.35rem; }
      .modal-close { top: 0.75rem; right: 0.85rem; }
    }
  </style>
</head>
<body>

<header>
  <button id="back-btn" onclick="showList()">&larr;</button>
  <div>
    <div class="site-title">Do Androids Ever Argue About Electric Sheep?</div>
    <div id="header-sub"></div>
  </div>
  <button id="about-btn" onclick="showAbout()" title="About">&#9432;</button>
</header>

<main>
  <div id="list-view">
    <div class="list-label">Conversations</div>
    <div id="cards"></div>
  </div>
  <div id="detail-view">
    <div id="chat-header"></div>
    <div id="chat-messages"></div>
  </div>
</main>

<footer>
  <div class="footer-tagline">an experiment in <em>synthetic dialogue</em> &mdash; because someone had to let them argue &nbsp;&#129302;</div>
  <div class="footer-links">
    <a href="https://github.com/rcavazza" target="_blank" rel="noopener noreferrer">
      <svg class="gh-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.65 7.65 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      rcavazza
    </a>
  </div>
</footer>

<div id="modal" onclick="onModalBgClick(event)">
  <div class="modal-card" id="modal-card"></div>
</div>

<script>
  /* â”€â”€ State â”€â”€ */
  let conversations = [];
  let charCache     = {};
  let sides         = { left: '', right: '' };

  /* â”€â”€ DOM refs â”€â”€ */
  const listView   = document.getElementById('list-view');
  const detailView = document.getElementById('detail-view');
  const backBtn    = document.getElementById('back-btn');
  const headerSub  = document.getElementById('header-sub');
  const cardsEl    = document.getElementById('cards');
  const chatHeader = document.getElementById('chat-header');
  const chatMsgs   = document.getElementById('chat-messages');
  const modal      = document.getElementById('modal');
  const modalCard  = document.getElementById('modal-card');

  /* â”€â”€ Helpers â”€â”€ */
  const esc = s => !s ? '' : String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const initial = s => (s || '?').charAt(0).toUpperCase();
  const sideOf  = id => id === sides.left ? 'left' : 'right';
  const clsOf   = id => sideOf(id) === 'left' ? 'ls' : 'rs';

  function getSides(turns) {
    const seen = [];
    for (const t of turns) {
      if (!seen.includes(t.llmId)) seen.push(t.llmId);
      if (seen.length === 2) break;
    }
    return { left: seen[0] || '', right: seen[1] || '' };
  }

  function cleanText(text) {
    return (text || '').replace(/^[A-Za-z][a-z]*\s*:\s*/, '').trim();
  }

  const fmtDate = ts => new Date(ts).toLocaleDateString('it-IT', { day:'2-digit', month:'short', year:'numeric' });
  const fmtTime = ts => new Date(ts).toLocaleTimeString('it-IT', { hour:'2-digit', minute:'2-digit' });

  /* â”€â”€ Character modal â”€â”€ */
  async function loadChar(llmId) {
    if (charCache[llmId] !== undefined) return charCache[llmId];
    try {
      const r = await fetch(`./characters/${llmId}.json`);
      charCache[llmId] = r.ok ? await r.json() : null;
    } catch { charCache[llmId] = null; }
    return charCache[llmId];
  }

  async function showCharModal(llmId) {
    const cls  = clsOf(llmId);
    const data = await loadChar(llmId);
    const name = data?.name || (llmId.charAt(0).toUpperCase() + llmId.slice(1));
    const bio  = data?.systemPrompt || 'No description available.';
    modalCard.innerHTML = `
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div class="modal-av ${cls}">${initial(name)}</div>
      <div class="modal-name">${esc(name)}</div>
      <div class="modal-id">${esc(llmId)}</div>
      <div class="modal-label">About</div>
      <div class="modal-bio">${esc(bio)}</div>
    `;
    modal.style.display = 'flex';
  }

  function closeModal() {
    modalCard.classList.add('closing');
    setTimeout(() => {
      modal.style.display = 'none';
      modalCard.classList.remove('closing');
    }, 240);
  }
  function onModalBgClick(e)   { if (e.target === modal) closeModal(); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // Swipe down to close on mobile
  let _touchY = 0;
  modalCard.addEventListener('touchstart', e => { _touchY = e.touches[0].clientY; }, { passive: true });
  modalCard.addEventListener('touchend',   e => { if (e.changedTouches[0].clientY - _touchY > 80) closeModal(); }, { passive: true });

  /* ── About ── */
  function showAbout() {
    modalCard.innerHTML = `
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div style="text-align:center;font-size:2.4rem;margin:0.25rem auto 0.85rem;letter-spacing:0.15em">&#129302;&#128172;&#129302;</div>
      <div class="modal-name">About this site</div>
      <div class="modal-id">how it works</div>
      <div class="modal-label">What is this?</div>
      <div class="modal-bio" style="margin-bottom:1rem">
        A read-only viewer for conversations between AI models &mdash; generated locally by a Node.js system that orchestrates two LLMs and lets them debate a topic, turn by turn.
      </div>
      <div class="modal-label">How are conversations made?</div>
      <div class="modal-bio" style="margin-bottom:1rem">
        The engine runs on your machine: it picks two AI characters (like a Philosopher and a Scientist), sets a topic, then has them talk to each other using real LLM APIs (Anthropic, OpenAI, GitHub Copilot&hellip;). The app also ships with a local web UI and a terminal UI to browse and manage conversations &mdash; this site is just the public-facing, read-only window on what was generated.
      </div>
      <div class="modal-label">Source</div>
      <div class="modal-bio">
        The code that generates these conversations is open source &rarr;
        <a href="https://github.com/rcavazza/llm-convo" target="_blank" rel="noopener noreferrer"
           style="color:var(--accent);text-decoration:none">github.com/rcavazza/llm-convo</a>
      </div>
    `;
    modal.style.display = 'flex';
  }

  /* ── Index / list ── */
  async function loadIndex() {
    try {
      const r = await fetch('./index.json');
      if (!r.ok) throw new Error('index.json not found');
      conversations = await r.json();
      conversations.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
      renderList();
    } catch (e) {
      cardsEl.innerHTML = `<p class="state-msg">Could not load conversations.<br><small>${esc(e.message)}</small></p>`;
    }
  }

  function renderList() {
    headerSub.textContent = `${conversations.length} conversation${conversations.length !== 1 ? 's' : ''}`;
    if (!conversations.length) {
      cardsEl.innerHTML = '<p class="state-msg">No conversations yet.</p>';
      return;
    }
    cardsEl.innerHTML = conversations.map(c => {
      const [p0, p1] = c.participants || [];
      const ls = esc(p0 || ''), rs = esc(p1 || '');
      const tags = (c.participants || []).map((p, i) =>
        `<span class="tag ${i === 0 ? 'ls' : 'rs'}"
          onclick="event.stopPropagation();sides={left:'${ls}',right:'${rs}'};showCharModal('${esc(p)}')"
        >${esc(p)}</span>`
      ).join('');
      return `
        <div class="conv-card" onclick="loadConversation('${esc(c.id)}','${esc(c.filename)}')">
          <div class="card-av">
            <div class="av ls">${initial(p0)}</div>
            ${p1 ? `<div class="av rs">${initial(p1)}</div>` : ''}
          </div>
          <div class="card-body">
            <div class="card-topic">${esc(c.topic)}</div>
            <div class="card-meta">${tags} Â· ${c.turns} turns</div>
          </div>
          <div class="card-date">${fmtDate(c.timestamp)}</div>
        </div>`;
    }).join('');
  }

  /* â”€â”€ Conversation detail â”€â”€ */
  async function loadConversation(id, filename) {
    window.location.hash = id;
    chatMsgs.innerHTML   = '<p class="state-msg">Loadingâ€¦</p>';
    chatHeader.innerHTML = '';
    showDetail();
    try {
      const r = await fetch(`./conversations/${filename}`);
      if (!r.ok) throw new Error(`File not found: ${filename}`);
      const turns = await r.json();
      const meta  = conversations.find(c => c.id === id) || {};
      sides = getSides(turns);
      renderChatHeader(meta);
      renderMessages(turns);
    } catch (e) {
      chatMsgs.innerHTML = `<p class="state-msg">Could not load conversation.<br><small>${esc(e.message)}</small></p>`;
    }
  }

  function renderChatHeader(meta) {
    const parts = (meta.participants || []).join(' · ');
    headerSub.innerHTML = `${esc(meta.topic || 'Conversation')}<span style="opacity:0.55;margin-left:0.5em">· ${esc(parts)}</span>`;
  }

  function renderMessages(turns) {
    chatMsgs.innerHTML = turns.map(t => {
      const side = sideOf(t.llmId);
      const cls  = clsOf(t.llmId);
      const text = cleanText(t.response);
      return `
        <div class="message ${side}">
          <div class="msg-av ${cls}" onclick="showCharModal('${esc(t.llmId)}')">${initial(t.llmId)}</div>
          <div class="msg-body">
            <div class="msg-name ${cls}" onclick="showCharModal('${esc(t.llmId)}')">${esc(t.llmId)}</div>
            <div class="bubble">${esc(text)}</div>
            <div class="msg-time">${fmtTime(t.timestamp)}</div>
          </div>
        </div>`;
    }).join('');
  }

  /* â”€â”€ Navigation â”€â”€ */
  function showDetail() {
    listView.style.display   = 'none';
    detailView.style.display = 'flex';
    backBtn.style.display    = 'block';
    headerSub.textContent    = '';
  }
  function showList() {
    listView.style.display   = 'block';
    detailView.style.display = 'none';
    backBtn.style.display    = 'none';
    window.location.hash     = '';
    headerSub.textContent    = `${conversations.length} conversation${conversations.length !== 1 ? 's' : ''}`;
  }

  window.addEventListener('hashchange', () => {
    const id = window.location.hash.slice(1);
    if (!id) { showList(); return; }
    const c = conversations.find(c => c.id === id);
    if (c) loadConversation(c.id, c.filename);
  });

  loadIndex().then(() => {
    const id = window.location.hash.slice(1);
    if (id) {
      const c = conversations.find(c => c.id === id);
      if (c) loadConversation(c.id, c.filename);
    }
  });
</script>
</body>
</html>
